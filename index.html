<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Craftium 3D: Mundo Aberto</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Press Start 2P', monospace; background: #0f172a; color: #fff; }

    /* OVERLAYS & MENUS */
    .overlay-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(3,7,18,0.98) 100%);
      z-index: 100; padding: 20px; text-align: center;
    }

    .title-banner {
      font-size: 2rem; color: #38bdf8;
      text-shadow: 4px 4px #0369a1, -2px -2px #000;
      margin-bottom: 20px; animation: float 3s ease-in-out infinite;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .menu-box {
      background: rgba(30, 41, 59, 0.95); border: 4px solid #38bdf8;
      padding: 25px; border-radius: 16px; width: 100%; max-width: 460px;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4);
    }

    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { font-size: 0.65rem; color: #94a3b8; display: block; margin-bottom: 8px; }
    .input-group input {
      width: 100%; padding: 12px; font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem; background: #0f172a; border: 2px solid #38bdf8;
      color: #fff; border-radius: 8px; outline: none; text-align: center;
    }

    .btn {
      width: 100%; padding: 15px; font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem; color: #fff; background: #2563eb; border: none;
      border-bottom: 5px solid #1d4ed8; border-radius: 8px; cursor: pointer;
      margin-top: 10px; transition: all 0.1s;
    }
    .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    .btn-success { background: #10b981; border-bottom-color: #047857; }

    /* HUD DO MUNDO 3D */
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
    
    .crosshair {
      position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
      transform: translate(-50%, -50%);
    }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
    .crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
    .crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

    .top-bar {
      position: absolute; top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; align-items: center;
    }
    
    .player-card {
      background: rgba(15, 23, 42, 0.85); padding: 10px 15px; border-radius: 10px;
      border: 2px solid #38bdf8; font-size: 0.65rem;
    }

    .timer-card {
      background: rgba(245, 158, 11, 0.95); padding: 10px 15px; border-radius: 10px;
      border: 2px solid #fff; font-size: 0.7rem; color: #000; font-weight: bold;
    }

    /* PLACA DE LORE / HISTÓRIA NO MUNDO */
    #lore-modal {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95); border: 3px solid #f59e0b;
      border-radius: 14px; padding: 16px 24px; width: 90%; max-width: 500px;
      text-align: center; display: none; pointer-events: auto; z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #lore-modal h3 { font-size: 0.8rem; color: #f59e0b; margin-bottom: 8px; }
    #lore-modal p { font-family: 'Poppins', sans-serif; font-size: 0.9rem; color: #cbd5e1; line-height: 1.4; }

    /* INTERFACE DO QUIZ */
    #quiz-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, #1e1b4b 0%, #090d16 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; z-index: 999; pointer-events: auto;
    }

    .battle-box {
      background: rgba(15, 23, 42, 0.95); border: 4px solid #a855f7;
      border-radius: 24px; padding: 25px; width: 100%; max-width: 520px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.5); text-align: center;
    }

    .battle-stats {
      display: flex; justify-content: space-between; margin-bottom: 15px;
      background: rgba(30, 41, 59, 0.8); padding: 12px 18px; border-radius: 12px;
      font-size: 0.7rem; border: 1px solid rgba(255,255,255,0.15);
    }

    .question-category {
      font-size: 0.6rem; color: #a855f7; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
    }

    .question-title {
      font-size: 0.95rem; color: #f8fafc; margin: 10px 0 20px; line-height: 1.5;
      font-family: 'Poppins', sans-serif; font-weight: 600;
    }

    .options-grid { display: flex; flex-direction: column; gap: 12px; }

    .option-btn {
      padding: 16px; background: #1e293b; border: 2px solid #3b82f6;
      border-radius: 12px; color: #fff; font-family: 'Poppins', sans-serif;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: space-between;
    }

    .option-btn:hover { background: #3b82f6; }

    .explanation-box {
      margin-top: 15px; font-size: 0.85rem; color: #f8fafc; font-family: 'Poppins', sans-serif;
      background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; padding: 12px; border-radius: 10px; display: none;
      text-align: left; line-height: 1.4;
    }

    /* CONTROLES MOBILE */
    #mobile-controls {
      position: absolute; bottom: 30px; width: 100%; display: none;
      justify-content: space-between; padding: 0 30px; pointer-events: none; z-index: 20;
    }
    .touch-btn {
      width: 65px; height: 65px; background: rgba(255,255,255,0.25);
      border: 2px solid #fff; border-radius: 50%; pointer-events: auto;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="start-screen" class="overlay-screen">
    <div class="title-banner">CRAFTIUM 3D</div>
    <div class="menu-box">
      <div class="input-group">
        <label>NOME DO NAVEGADOR:</label>
        <input type="text" id="player-name-input" value="Explorador" maxlength="12">
      </div>

      <div style="font-size: 0.6rem; color: #94a3b8; margin-bottom: 15px; line-height: 1.5;">
        🌲 <strong>MUNDO ABERTO & EXPLORAÇÃO:</strong><br>
        Explore livremente as colinas, florestas e tótens de história por <strong>60 segundos</strong> antes de entrar no Quiz!
      </div>

      <button class="btn btn-success" onclick="startGame()">ENTRAR NO MUNDO</button>
    </div>
  </div>

  <!-- HUD DO MUNDO 3D -->
  <div id="hud">
    <div class="crosshair"></div>
    <div class="top-bar">
      <div class="player-card">
        👤 <span id="hud-player-name">Explorador</span>
      </div>
      <div class="timer-card">
        ⏳ Quiz em: <span id="hud-timer">60</span>s
      </div>
    </div>
  </div>

  <!-- MODAL DE HISTÓRIA -->
  <div id="lore-modal">
    <h3 id="lore-title">LORE DO MINECRAFT</h3>
    <p id="lore-text">Texto descritivo...</p>
  </div>

  <!-- TELA DO QUIZ -->
  <div id="quiz-screen">
    <div class="battle-box">
      <div class="question-category" id="question-cat">QUIZ SOBRE O JOGO</div>
      
      <div class="battle-stats">
        <span>Pontos: <strong id="quiz-score" style="color: #38bdf8;">0</strong></span>
        <span>Vidas: <span id="quiz-lives">❤️❤️❤️</span></span>
      </div>

      <div class="question-title" id="question-text">Carregando pergunta...</div>

      <div class="options-grid" id="options-container"></div>
      
      <div class="explanation-box" id="explanation-box"></div>
    </div>
  </div>

  <!-- CONTROLES MÓVEIS -->
  <div id="mobile-controls">
    <div class="touch-btn" id="btn-forward">⬆️</div>
    <div class="touch-btn" id="btn-jump">🚀</div>
  </div>

  <script>
    // AUDIO FX SINTETIZADO
    const AudioFX = {
      ctx: null,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      playPortal() {
        this.init();
        const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sine'; osc.connect(g); g.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.5);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start(); osc.stop(this.ctx.currentTime + 0.5);
      },
      playSuccess() {
        this.init();
        const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.connect(g); g.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659, this.ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start(); osc.stop(this.ctx.currentTime + 0.3);
      },
      playError() {
        this.init();
        const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.connect(g); g.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.setValueAtTime(80, this.ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start(); osc.stop(this.ctx.currentTime + 0.3);
      }
    };

    // PERGUNTAS EDUCATIVAS SOBRE O MINECRAFT
    const QUIZ_QUESTIONS = [
      {
        cat: "HISTÓRIA DA CRIAÇÃO",
        q: "Quem criou a primeira versão do Minecraft em 2009?",
        opts: ["Markus Persson (Notch)", "Bill Gates", "Shigeru Miyamoto", "Gabe Newell"],
        ans: 0,
        info: "💡 <strong>Aprenda:</strong> Markus Persson (Notch) programou a primeira versão do jogo em apenas 6 dias no ano de 2009!"
      },
      {
        cat: "EMPRESA & EXPANSÃO",
        q: "Qual estúdio fundado por Notch desenvolveu o jogo antes de ser adquirido pela Microsoft?",
        opts: ["Mojang Studios", "Epic Games", "Ubisoft", "EA Games"],
        ans: 0,
        info: "💡 <strong>Aprenda:</strong> A Mojang foi criada na Suécia e adquirida pela Microsoft em 2014 por US$ 2,5 bilhões."
      },
      {
        cat: "CURIOSIDADES DO JOGO",
        q: "Qual mob icônico nasceu de um erro de código ao tentar criar um porco?",
        opts: ["Creeper", "Zombie", "Skeleton", "Enderman"],
        ans: 0,
        info: "💡 <strong>Aprenda:</strong> Notch errou a altura e largura ao codificar um porco, gerando o icônico Creeper!"
      },
      {
        cat: "MECÂNICAS DO JOGO",
        q: "Qual minério é necessário para criar circuitos lógicos e automações no jogo?",
        opts: ["Redstone", "Diamante", "Carvão", "Ferro"],
        ans: 0,
        info: "💡 <strong>Aprenda:</strong> A Redstone funciona como a energia elétrica do jogo, permitindo criar computadores e mecanismos incríveis!"
      },
      {
        cat: "RECORDES MUNDIAIS",
        q: "Qual marca histórica de vendas o Minecraft atingiu, tornando-se o jogo mais vendido da história?",
        opts: ["Mais de 300 milhões de cópias", "50 milhões de cópias", "10 milhões de cópias", "100 mil cópias"],
        ans: 0,
        info: "💡 <strong>Aprenda:</strong> Minecraft é o maior sucesso da história dos games, superando 300 milhões de cópias!"
      }
    ];

    // TÓTENS ESPALHADOS PELO MUNDO ABERTO
    const LORE_POSTS = [
      { x: 4, z: -5, title: "📜 A Origem (2009)", text: "Em 2009, o jogo nasceu como 'Cave Game' criado por Notch na Suécia usando Java." },
      { x: -6, z: -8, title: "🟢 O Surgimento do Creeper", text: "Em 2009, um erro no modelo 3D de um porco criou o famoso mob explosivo Creeper!" },
      { x: 6, z: -10, title: "🏰 A Compra pela Microsoft", text: "Em 2014, a Microsoft adquiriu a Mojang por 2.5 bilhões de dólares." }
    ];

    let scene, camera, renderer;
    let portalMesh = null;
    let playerName = "Explorador";
    let inPortal = false;
    let exploreTimeLeft = 60;
    let timerInterval = null;
    let quizScore = 0;
    let quizLives = 3;
    let currentQuestionIdx = 0;

    function createTexture(colorHex, noiseDensity = 40) {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colorHex; ctx.fillRect(0, 0, 64, 64);
      for (let i = 0; i < noiseDensity; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
        ctx.fillRect(Math.random()*64, Math.random()*64, 4, 4);
      }
      return new THREE.CanvasTexture(canvas);
    }

    function startGame() {
      playerName = document.getElementById('player-name-input').value || "Explorador";
      document.getElementById('hud-player-name').innerText = playerName;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';

      if ('ontouchstart' in window) {
        document.getElementById('mobile-controls').style.display = 'flex';
      }

      initEngine();
      startExploreTimer();

      document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
      document.body.requestPointerLock();
    }

    function startExploreTimer() {
      timerInterval = setInterval(() => {
        exploreTimeLeft--;
        document.getElementById('hud-timer').innerText = exploreTimeLeft;
        
        if (exploreTimeLeft <= 0) {
          clearInterval(timerInterval);
          if (!inPortal) enterBattlePortal();
        }
      }, 1000);
    }

    function initEngine() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0x38bdf8, 0.025);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 3, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const light = new THREE.DirectionalLight(0xffffff, 0.7);
      light.position.set(20, 40, 20);
      scene.add(light);

      buildOpenWorld();
      setupControls();
      animate();
    }

    // CONSTRUÇÃO DO MUNDO ABERTO (COLINAS, FLORESTA E TÓTENS ESPALHADOS)
    function buildOpenWorld() {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      const grassMat = new THREE.MeshLambertMaterial({ map: createTexture('#3a7d2c') });
      const dirtMat = new THREE.MeshLambertMaterial({ map: createTexture('#5c4033') });
      const woodMat = new THREE.MeshLambertMaterial({ map: createTexture('#422a1d') });
      const leavesMat = new THREE.MeshLambertMaterial({ map: createTexture('#15803d') });
      const obsidianMat = new THREE.MeshLambertMaterial({ map: createTexture('#0f172a') });
      const portalMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.85 });

      // Geração de Terreno Orgânico com Colinas (Perlin-like simples com Math.sin/cos)
      for (let x = -14; x <= 14; x++) {
        for (let z = -16; z <= 10; z++) {
          const height = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 1.5);
          
          for (let y = height; y >= height - 1; y--) {
            const mat = y === height ? grassMat : dirtMat;
            const block = new THREE.Mesh(geo, mat);
            block.position.set(x, y, z);
            scene.add(block);
          }
        }
      }

      // Espalhar Árvores Realistas pelo Mundo Aberto
      const treePositions = [
        [-5, -3], [6, -4], [-8, -7], [9, -6], [-3, -11], [4, -12], [-10, -2], [10, -3]
      ];

      treePositions.forEach(pos => {
        createRealisticTree(pos[0], 1, pos[1], woodMat, leavesMat);
      });

      // Posicionar Tótens de História no Mundo
      LORE_POSTS.forEach(post => {
        const totem = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.2, 0.8), obsidianMat);
        totem.position.set(post.x, 1.5, post.z);
        scene.add(totem);
      });

      // Portal Místico no Fundo do Mundo Aberto (x:0, z:-14)
      const portalGroup = new THREE.Group();
      for(let y=1; y<=4; y++) {
        const left = new THREE.Mesh(geo, obsidianMat); left.position.set(-1.5, y, 0); portalGroup.add(left);
        const right = new THREE.Mesh(geo, obsidianMat); right.position.set(1.5, y, 0); portalGroup.add(right);
      }
      for(let x=-1.5; x<=1.5; x++) {
        const top = new THREE.Mesh(geo, obsidianMat); top.position.set(x, 5, 0); portalGroup.add(top);
        const bottom = new THREE.Mesh(geo, obsidianMat); bottom.position.set(x, 1, 0); portalGroup.add(bottom);
      }

      portalMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.2), portalMat);
      portalMesh.position.set(0, 3, 0);
      portalGroup.add(portalMesh);

      portalGroup.position.set(0, 0, -14);
      scene.add(portalGroup);
    }

    function createRealisticTree(x, y, z, woodMat, leavesMat) {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      for(let i=0; i<4; i++) {
        const trunk = new THREE.Mesh(geo, woodMat);
        trunk.position.set(x, y+i, z);
        scene.add(trunk);
      }
      for(let layer=0; layer<3; layer++) {
        const radius = 2 - layer;
        for(let lx=-radius; lx<=radius; lx++) {
          for(let lz=-radius; lz<=radius; lz++) {
            const leaf = new THREE.Mesh(geo, leavesMat);
            leaf.position.set(x+lx, y+4+layer, z+lz);
            scene.add(leaf);
          }
        }
      }
    }

    let keys = {};
    let touchMove = false;

    function setupControls() {
      window.addEventListener('keydown', e => keys[e.code] = true);
      window.addEventListener('keyup', e => keys[e.code] = false);

      document.addEventListener('mousemove', e => {
        if (document.pointerLockElement === document.body) {
          camera.rotation.y -= e.movementX * 0.002;
          camera.rotation.x -= e.movementY * 0.002;
          camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
      });

      const btnFwd = document.getElementById('btn-forward');
      btnFwd.addEventListener('touchstart', () => touchMove = true);
      btnFwd.addEventListener('touchend', () => touchMove = false);

      document.getElementById('btn-jump').addEventListener('click', () => {
        if (camera.position.y <= 3.2) camera.position.y += 1.5;
      });
    }

    function enterBattlePortal() {
      inPortal = true;
      clearInterval(timerInterval);
      AudioFX.playPortal();
      
      if (document.exitPointerLock) document.exitPointerLock();

      document.getElementById('hud').style.display = 'none';
      document.getElementById('lore-modal').style.display = 'none';
      document.getElementById('mobile-controls').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'flex';

      loadQuestion();
    }

    function loadQuestion() {
      document.getElementById('explanation-box').style.display = 'none';

      if (currentQuestionIdx >= QUIZ_QUESTIONS.length) {
        alert(`🏆 PARABÉNS, ${playerName}! VOCÊ FINALIZOU O QUIZ EDUCACIONAL!\nPontuação Final: ${quizScore}`);
        location.reload();
        return;
      }

      const qData = QUIZ_QUESTIONS[currentQuestionIdx];
      document.getElementById('question-cat').innerText = qData.cat;
      document.getElementById('question-text').innerText = qData.q;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      qData.opts.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${optText}</span> <span>➔</span>`;
        
        const handleChoice = (e) => {
          e.preventDefault();
          e.stopPropagation();
          answerQuestion(idx === qData.ans, qData.info, btn);
        };

        btn.addEventListener('click', handleChoice);
        btn.addEventListener('touchend', handleChoice);

        container.appendChild(btn);
      });
    }

    function answerQuestion(isCorrect, infoText, selectedBtn) {
      const expBox = document.getElementById('explanation-box');

      if (isCorrect) {
        AudioFX.playSuccess();
        selectedBtn.style.background = '#10b981';
        selectedBtn.style.borderColor = '#047857';
        quizScore += 20;
        document.getElementById('quiz-score').innerText = quizScore;
        currentQuestionIdx++;
        setTimeout(loadQuestion, 1200);
      } else {
        AudioFX.playError();
        selectedBtn.style.background = '#ef4444';
        selectedBtn.style.borderColor = '#b91c1c';
        
        expBox.innerHTML = infoText;
        expBox.style.display = 'block';

        quizLives--;
        document.getElementById('quiz-lives').innerText = '❤️'.repeat(Math.max(0, quizLives));

        if (quizLives <= 0) {
          setTimeout(() => {
            alert(`💥 FIM DE JOGO! Suas vidas acabaram. Pontuação: ${quizScore}`);
            location.reload();
          }, 2500);
        } else {
          setTimeout(() => {
            currentQuestionIdx++;
            loadQuestion();
          }, 3500);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!inPortal) {
        const speed = 0.12;
        if (keys['KeyW'] || touchMove) camera.translateZ(-speed);
        if (keys['KeyS']) camera.translateZ(speed);
        if (keys['KeyA']) camera.translateX(-speed);
        if (keys['KeyD']) camera.translateX(speed);
        if (keys['Space']) camera.position.y += 0.08;
        
        if (camera.position.y > 3) camera.position.y -= 0.04;

        if (portalMesh) portalMesh.rotation.y += 0.03;

        let nearLore = false;
        LORE_POSTS.forEach(post => {
          const dist = camera.position.distanceTo(new THREE.Vector3(post.x, 2, post.z));
          if (dist < 2.5) {
            nearLore = true;
            document.getElementById('lore-title').innerText = post.title;
            document.getElementById('lore-text').innerText = post.text;
            document.getElementById('lore-modal').style.display = 'block';
          }
        });
        if (!nearLore) document.getElementById('lore-modal').style.display = 'none';

        const distToPortal = camera.position.distanceTo(new THREE.Vector3(0, 2, -14));
        if (distToPortal < 1.8) {
          enterBattlePortal();
        }

        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
